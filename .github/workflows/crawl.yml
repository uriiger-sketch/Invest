name: crawl

# Runs the pipeline every 20 min (plus on-demand and on push). Each run:
#   1. commits the refreshed REPORT.md + docs/index.html back to the branch
#   2. publishes docs/ to GitHub Pages so the top-20 is viewable in a browser
#
# Notes on reliability:
# - GitHub's scheduled workflows are best-effort. 5–15 min jitter is normal,
#   and ticks CAN be skipped under load. Running at */20 means we get ~3
#   runs/hour in practice; the report banner exposes the real last-ran time.
# - Fast and deep runs use separate concurrency groups so the daily deep
#   ingest cannot starve the 20-min fast heartbeat.
# - Auto-commit messages end with "[skip ci]" so the workflow does not
#   re-trigger itself.

on:
  schedule:
    # Fast refresh every 20 min (prices + consensus + stooq backfill).
    - cron: "*/20 * * * *"
    # Deep refresh once a day at 23:30 UTC (fundamentals + EDGAR 13F + Form 4).
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      universe_max:
        description: "Universe cap for this run (0 = no cap)"
        required: false
        default: "80"
      deep:
        description: "Full ingest (fundamentals + Finnhub + EDGAR, slower)"
        type: boolean
        default: false
  push:
    branches:
      - "claude/**"
      - main
    paths-ignore:
      - "REPORT.md"
      - "docs/**"
      - "**.md"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    # Separate concurrency groups per run type so the nightly deep run cannot
    # block the every-20-min fast heartbeat. cancel-in-progress=true ensures
    # a new cron tick always gets attention even if the previous is slow.
    concurrency:
      group: >-
        crawl-${{ github.ref }}-${{
          (inputs.deep == true || github.event.schedule == '30 23 * * *')
          && 'deep' || 'fast'
        }}
      cancel-in-progress: true
    timeout-minutes: 20
    env:
      INVEST_DB_URL: sqlite:///data/invest.db
      UNIVERSE_MAX: ${{ inputs.universe_max || '80' }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Invest Research Client <you@example.com>' }}
      RUN_SCHEDULER: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DEEP_RUN: >-
        ${{ (inputs.deep == true || github.event.schedule == '30 23 * * *')
           && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (prefer wheels)
        run: |
          pip install --only-binary=:all: multitasking || true
          pip install -e ".[dev]"

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data/invest.db
          key: invest-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            invest-db-${{ runner.os }}-

      - name: Migrate
        run: |
          mkdir -p data docs
          alembic upgrade head

      - name: Ingest (fast)
        if: ${{ env.DEEP_RUN == 'false' }}
        timeout-minutes: 8
        run: python -m invest.cli ingest-fast
        continue-on-error: true

      - name: Ingest (deep — fundamentals + Finnhub + EDGAR 13F + Form 4)
        if: ${{ env.DEEP_RUN == 'true' }}
        timeout-minutes: 15
        run: python -m invest.cli ingest
        continue-on-error: true

      - name: Rank
        timeout-minutes: 3
        run: python -m invest.cli rank

      - name: Generate report
        run: python scripts/generate_report.py

      - name: Commit report back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Always rebase to account for other runs that may have committed.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add REPORT.md docs/index.html
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "chore(report): refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # Retry push once in case of a race with another run.
            for i in 1 2 3; do
              if git push; then
                break
              fi
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              sleep 2
            done
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Upload SQLite artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invest-db-${{ github.run_id }}
          path: data/invest.db
          retention-days: 7

  deploy-pages:
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
