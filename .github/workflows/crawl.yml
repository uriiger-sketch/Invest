name: crawl

# Runs the pipeline every 30 minutes (plus on-demand and on push). Each run:
#   1. commits the refreshed REPORT.md + docs/index.html back to the branch
#   2. publishes docs/ to GitHub Pages so the top picks are viewable in a browser
#
# Timing headroom: the fast path (prices + full-universe coverage sweep) was
# measured at ~4 minutes end-to-end on a 301-ticker universe (prices ~30s,
# stooq backfill ~2s, coverage sweep ~3.5min), plus ~1-2 min of
# checkout/install/rank/report/commit overhead — comfortably inside a
# 30-minute window with margin to spare.
#
# Notes on reliability:
# - GitHub's scheduled workflows are best-effort. 5–15 min jitter is normal,
#   and ticks CAN be skipped under load, so treat "every 30 min" as "about
#   every 30 min"; the report banner exposes the real last-ran time.
# - Fast and deep runs use separate concurrency groups so the daily deep
#   ingest cannot starve the 30-min fast heartbeat.
# - Auto-commit messages end with "[skip ci]" so the workflow does not
#   re-trigger itself.

on:
  schedule:
    # Fast refresh every 30 minutes (prices + full coverage sweep).
    - cron: "*/30 * * * *"
    # Deep refresh once a day at 23:30 UTC (fundamentals + EDGAR 13F + Form 4 + ML training).
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      universe_max:
        description: "Universe cap for this run (0 = no cap)"
        required: false
        default: "0"
      deep:
        description: "Full ingest (fundamentals + Finnhub + EDGAR, slower)"
        type: boolean
        default: false
  push:
    branches:
      - "claude/**"
      - main
    paths-ignore:
      - "REPORT.md"
      - "docs/**"
      - "**.md"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    # Separate concurrency groups per run type so the nightly deep run cannot
    # block the every-20-min fast heartbeat. cancel-in-progress=true ensures
    # a new cron tick always gets attention even if the previous is slow.
    concurrency:
      group: >-
        crawl-${{ github.ref }}-${{
          (inputs.deep == true || github.event.schedule == '30 23 * * *')
          && 'deep' || 'fast'
        }}
      cancel-in-progress: true
    timeout-minutes: 50
    env:
      INVEST_DB_URL: sqlite:///data/invest.db
      UNIVERSE_MAX: ${{ inputs.universe_max || '0' }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Invest Research Client <you@example.com>' }}
      RUN_SCHEDULER: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DEEP_RUN: >-
        ${{ (inputs.deep == true || github.event.schedule == '30 23 * * *')
           && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (prefer wheels)
        run: |
          pip install --only-binary=:all: multitasking || true
          pip install -e ".[dev]"

      # NOTE: state is the COMMITTED data/invest.db, not actions/cache.
      # actions/cache was silently losing the database: its key embedded
      # github.run_id so it never hit exactly, restore-keys served an
      # arbitrarily old fallback, and GitHub evicts caches after 7 days.
      # On eviction the DB came back EMPTY, which is how the pipeline ended
      # up ranking stocks with no analyst data at all.
      - name: Migrate
        run: |
          mkdir -p data docs
          alembic upgrade head

      - name: Ingest (fast — prices + rolling consensus refresh)
        if: ${{ env.DEEP_RUN == 'false' }}
        timeout-minutes: 25
        run: python -m invest.cli ingest-fast

      - name: Ingest (deep — fundamentals + Finnhub + EDGAR 13F + Form 4)
        if: ${{ env.DEEP_RUN == 'true' }}
        timeout-minutes: 35
        run: python -m invest.cli ingest

      # No continue-on-error: if ranking produces nothing the run MUST fail
      # so the previous good report stays published and we get told about it.
      - name: Rank
        timeout-minutes: 10
        run: python -m invest.cli rank

      # ML training only runs on the deep (nightly) pass, not every 30-min
      # fast run — LightGBM training is unnecessary overhead at that cadence,
      # and `train()` self-gates on COLD_START_MIN_DAYS anyway. This step
      # existing at all is the fix: `rank` now persists a feature snapshot
      # every run, but nothing ever CALLED `invest train`, so the ML side of
      # the composite+ML blend never trained and `ml_score` was silently
      # identical to `composite_score` for every row ever persisted.
      - name: Train ML models (deep run only)
        if: ${{ env.DEEP_RUN == 'true' }}
        timeout-minutes: 10
        run: python -m invest.cli train

      - name: Generate report
        run: python scripts/generate_report.py

      - name: Commit report back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/invest.db is committed so state survives between runs.
          git add REPORT.md docs/index.html docs/history.jsonl data/invest.db
          # data/models only exists after a deep run's Train step; commit it
          # the same way so a trained model survives to the next run instead
          # of being discarded when the runner is torn down.
          if [ -d data/models ]; then git add data/models; fi
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "chore(report): refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # Commit LOCALLY first, then push — do NOT `git pull --rebase
            # --autostash` before committing. That used to stash this run's
            # freshly-generated data/invest.db, fast-forward onto whatever a
            # concurrently-landed run had just pushed, then try to reapply
            # the stash. A 30-minute fast cadence made a fast run landing
            # mid-deep-run common, and stashing/reapplying a BINARY file
            # (SQLite) that both runs modified is not a real merge — git
            # reported "Applying autostash resulted in conflicts" and left
            # data/invest.db as whatever was already on origin, and the
            # follow-up `git add` + `git commit` silently accepted that as
            # "resolved". The entire deep run's EDGAR/13F/Form4/ML work
            # (10+ minutes of ingest) was discarded without the workflow
            # ever failing or logging an error.
            #
            # Rebasing onto origin AFTER committing, with `-X theirs`, is
            # deterministic instead: on any conflicting hunk — including
            # whole-file conflicts on binaries, which `-X ours`/`-X theirs`
            # explicitly supports — this run's own commit wins outright.
            # That's the correct call here: this run's data/invest.db is a
            # superset of (deep) or no worse than (fast vs fast) whatever a
            # concurrent run wrote, and any prices it's missing get
            # refreshed again on the very next 30-minute tick regardless.
            #
            # NOTE the flag is `-X theirs`, NOT `-X ours`, and this is
            # load-bearing: `git rebase`'s ours/theirs are the OPPOSITE of
            # `git merge`'s, because rebase works by checking out the
            # upstream target and replaying your commits onto it one at a
            # time — from inside that replay, "ours" means the upstream
            # branch being rebased ONTO (origin, i.e. the OTHER run) and
            # "theirs" means the commit being replayed (THIS run's own
            # work). `-X ours` was verified against a local simulation to
            # silently resolve every conflicting hunk in favour of origin,
            # making the rebased commit a no-op ("patch contents already
            # upstream") that git drops entirely — reintroducing the exact
            # silent-data-loss bug this rewrite exists to fix, but with no
            # "conflicts" message at all this time to notice it by.
            pushed=false
            for i in 1 2 3 4; do
              if git push; then
                pushed=true
                break
              fi
              git fetch origin "${GITHUB_REF_NAME}" || true
              if ! git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort
                echo "::warning::rebase -X theirs failed on attempt $i; retrying"
              fi
              sleep 2
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::failed to push report after retries — this run's ingest work was NOT published"
              exit 1
            fi
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Upload SQLite artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invest-db-${{ github.run_id }}
          path: data/invest.db
          retention-days: 7

  deploy-pages:
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # The github-pages environment URL is PERMANENT: every deployment serves
    # at https://uriiger-sketch.github.io/Invest/ — bookmark that one link;
    # it never changes between runs (unlike per-run artifact URLs).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Publish permanent link in run summary
        if: always()
        run: |
          {
            echo "## 📈 Invest — live report"
            echo ""
            if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
              echo "**Permanent link (same every deployment):** ${{ steps.deployment.outputs.page_url }}"
            else
              echo "**Permanent link (same every deployment):** https://uriiger-sketch.github.io/Invest/"
              echo ""
              echo "> Pages deployment did not report a URL this run. If the link 404s,"
              echo "> enable it once: repo **Settings → Pages → Source: GitHub Actions**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
